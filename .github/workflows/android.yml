name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TOOLS: "36.0.0"
  APP_ID: "com.egrmeister.watertiles"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 36 and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;${BUILD_TOOLS}" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintRelease

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify signatures, permissions and native alignment
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          mkdir -p verification
          test -f "$APK" && test -f "$AAB"

          # Expected signer = certificate stored in the keystore.
          EXPECTED=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Expected signer SHA-256: $EXPECTED" | tee verification/expected-signer.txt

          # APK: apksigner must verify; never accept the debug certificate.
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee verification/apk-signature.txt
          if grep -q "CN=Android Debug" verification/apk-signature.txt; then echo "APK is debug-signed"; exit 1; fi
          APK_SHA=$(grep -m1 "certificate SHA-256 digest" verification/apk-signature.txt | awk -F': ' '{print $2}' | tr -d ' ')
          [ "$APK_SHA" = "$EXPECTED" ] || { echo "APK signer mismatch: $APK_SHA"; exit 1; }

          # AAB: JAR signature integrity and expected signer (self-signed upload keys are valid).
          jarsigner -verify -verbose -certs "$AAB" > verification/aab-jarsigner.txt 2>&1 || { cat verification/aab-jarsigner.txt; exit 1; }
          grep -q "jar verified." verification/aab-jarsigner.txt || { tail -50 verification/aab-jarsigner.txt; exit 1; }
          if grep -q "CN=Android Debug" verification/aab-jarsigner.txt; then echo "AAB is debug-signed"; exit 1; fi
          keytool -printcert -jarfile "$AAB" | tee verification/aab-cert.txt
          AAB_SHA=$(awk -F': ' '/SHA256:/{print $2; exit}' verification/aab-cert.txt | tr -d ':' | tr 'A-F' 'a-f')
          [ "$AAB_SHA" = "$EXPECTED" ] || { echo "AAB signer mismatch: $AAB_SHA"; exit 1; }

          # Permission allowlist on the packaged manifest.
          python3 scripts/check_permissions.py "$BT/aapt2" "$APK" "$APP_ID" | tee verification/permissions.txt

          # 16 KB: native libraries and alignment (APK zip alignment + ELF LOAD segments).
          python3 scripts/check_native_alignment.py "$APK" "$AAB" | tee verification/native-libs.txt
          if unzip -l "$APK" | grep -q '\.so$'; then
            "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -5 | tee -a verification/native-libs.txt
          fi

          # Sizes.
          ls -l "$APK" "$AAB" | tee verification/sizes.txt
          {
            echo "### WaterTiles release"
            echo "- APK: $(du -h "$APK" | cut -f1) ($(stat -c%s "$APK") bytes)"
            echo "- AAB: $(du -h "$AAB" | cut -f1) ($(stat -c%s "$AAB") bytes)"
            echo "- Signer SHA-256: $EXPECTED"
            echo '```'; cat verification/native-libs.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified artifacts
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: watertiles-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            verification/
          if-no-files-found: warn

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
